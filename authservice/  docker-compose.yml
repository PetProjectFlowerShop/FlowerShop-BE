version: '3.8'

services:

  postgres:

    image: postgres:15

    container_name: postgres_db_for_floria

    restart: always

    environment:

      POSTGRES_DB: user_db

      POSTGRES_USER: postgres_user

      POSTGRES_PASSWORD: postgres_pass

    ports:

      - "5432:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data

volumes:

  postgres_data:

spring:
  application:
    name: product-service

  datasource:
    url: jdbc:postgresql://localhost:5436/order
    username: ${PRODUCT_DB_USER:postgres}
    password: ${PRODUCT_DB_PASSWORD:postgres}

  jpa:
    hibernate:
    ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

